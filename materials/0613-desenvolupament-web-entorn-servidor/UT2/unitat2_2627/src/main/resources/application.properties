spring.application.name=unitat2_2627

# Connexió a H2 en memòria: cada arrencada comença amb dades de demostració.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tradueix el mapatge de les entitats a SQL per a H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# none: no gestiona l'esquema; validate: comprova que coincideix amb les entitats.
# update: adapta l'esquema; create: el recrea; create-drop: també l'elimina en aturar.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Primer Hibernate crea les taules; després Spring Boot executa data.sql.
# H2 és una BD integrada: no cal spring.sql.init.mode=always en aquest projecte.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Ampliació de relacions: les lectures es resolen dins la transacció del servei.
# La serialització JSON no ha de carregar col·leccions fora de la transacció.
spring.jpa.open-in-view=false

# Consola web d'H2 (amb Boot 3.5, les dependències actuals són suficients).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
